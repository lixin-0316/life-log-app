<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统配置协作管理平台</title>
<style>
  :root{
    --bg:#f0f2f5; --panel:#ffffff; --line:#e8e8e8; --line2:#f0f0f0;
    --text:#1f2329; --text2:#646a73; --text3:#8f959e;
    --primary:#1677ff; --primary-h:#4096ff; --primary-bg:#e6f0ff;
    --green:#52c41a; --green-bg:#f0fbe9; --green-bd:#b7eb8f;
    --red:#ff4d4f; --red-bg:#fff1f0; --red-bd:#ffccc7;
    --gold:#faad14; --gold-bg:#fffbe6; --gold-bd:#ffe58f;
    --gray:#8c8c8c; --gray-bg:#fafafa; --gray-bd:#d9d9d9;
    --blue-tag:#1677ff; --blue-bg:#e6f0ff; --blue-bd:#91caff;
    --shadow:0 1px 4px rgba(0,0,0,.06),0 2px 12px rgba(0,0,0,.04);
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);font-size:13px;height:100vh;overflow:hidden}

  .app{display:flex;height:100vh}
  .sidebar{width:220px;background:#001529;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
  .logo{padding:18px 20px;font-size:16px;font-weight:700;letter-spacing:1px;
    border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
  .logo .mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#1677ff,#69b1ff);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
  .nav{flex:1;padding:10px 0;overflow-y:auto}
  .nav-group{font-size:11px;color:rgba(255,255,255,.45);padding:14px 20px 6px}
  .nav-item{padding:11px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;
    color:rgba(255,255,255,.75);border-left:3px solid transparent;transition:.15s;font-size:13px}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item.active{background:#1677ff;color:#fff;border-left-color:#69b1ff}
  .nav-ico{width:16px;height:16px;display:inline-block;flex-shrink:0}
  .side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.5)}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
  .crumb{font-size:15px;font-weight:600;color:var(--text)}
  .crumb .sub{font-size:12px;color:var(--text3);font-weight:400;margin-left:10px}
  .user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:600}
  .content{flex:1;overflow-y:auto;padding:20px 24px}

  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .card-title .r{font-size:12px;color:var(--text3);font-weight:400}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:6px;
    border:1px solid var(--gray-bd);background:#fff;color:var(--text);cursor:pointer;font-size:13px;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-h);border-color:var(--primary-h);color:#fff}
  .btn.danger{color:var(--red);border-color:var(--red-bd)}
  .btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
  .btn.sm{padding:4px 10px;font-size:12px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
  .btn.ghost:hover{background:var(--primary-bg)}

  .tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:4px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
  .tag.green{background:var(--green-bg);color:#389e0d;border:1px solid var(--green-bd)}
  .tag.blue{background:var(--blue-bg);color:#0958d9;border:1px solid var(--blue-bd)}
  .tag.red{background:var(--red-bg);color:#cf1322;border:1px solid var(--red-bd)}
  .tag.gold{background:var(--gold-bg);color:#d48806;border:1px solid var(--gold-bd)}
  .tag.gray{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray-bd)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

  input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--gray-bd);
    border-radius:6px;outline:none;color:var(--text);background:#fff;width:100%;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
  textarea{resize:vertical;min-height:60px}
  label.fld{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
  label.fld .req{color:var(--red);margin-left:2px}

  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:18px}
  .stat{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
  .stat .num{font-size:30px;font-weight:700;line-height:1;margin-top:6px}
  .stat .lab{font-size:12px;color:var(--text3)}
  .stat .bar{position:absolute;left:0;bottom:0;height:3px;width:100%}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .prog-wrap{display:flex;align-items:center;gap:14px}
  .prog-ring{flex-shrink:0}
  .prog-meta{font-size:12px;color:var(--text2);line-height:1.9}
  .prog-meta b{color:var(--primary);font-size:15px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 12px;background:#fafafa;color:var(--text2);font-weight:600;border-bottom:1px solid var(--line);font-size:12px}
  td{padding:10px 12px;border-bottom:1px solid var(--line2);color:var(--text)}
  tr:hover td{background:#fafcff}
  .mini-row{display:flex;align-items:center;gap:8px}

  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .kcol{background:#f7f8fa;border-radius:var(--radius);padding:12px;min-height:200px}
  .kcol.hl{outline:2px dashed var(--primary);outline-offset:-2px;background:#f0f6ff}
  .kcol-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600;font-size:13px;padding:2px 4px}
  .kcol-head .cnt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;color:var(--text2)}
  .kcard{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:11px;margin-bottom:10px;cursor:pointer;
    border-left:3px solid var(--primary);transition:.12s}
  .kcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);transform:translateY(-1px)}
  .kcard .t{font-weight:600;font-size:13px;margin-bottom:8px;line-height:1.4}
  .kcard .meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .kcard .roles{display:flex;flex-wrap:wrap;gap:4px}
  .rtag{font-size:11px;padding:1px 6px;border-radius:3px}
  .rtag.r{background:var(--blue-bg);color:#0958d9}
  .rtag.p{background:var(--gold-bg);color:#d48806}
  .rtag.k{background:var(--gray-bg);color:var(--gray)}
  .kcard .due{font-size:11px;color:var(--text3);margin-top:6px}
  .kcard.over .due{color:var(--red);font-weight:600}

  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .filter-bar .fitem{display:flex;align-items:center;gap:6px}
  .filter-bar input,.filter-bar select{width:auto;min-width:120px}

  .matrix td .mb{display:inline-block;min-width:54px;text-align:center}
  .role-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
  .role-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  .role-card h4{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .role-card .lg{font-size:12px;color:var(--text2);display:flex;gap:14px;flex-wrap:wrap}
  .role-card .lg b{font-size:16px;color:var(--text)}

  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--text2)}
  .legend .li{display:flex;align-items:center;gap:8px}
  .barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
  .barrow .name{width:110px;text-align:right;color:var(--text2)}
  .barrow .track{flex:1;background:#f0f2f5;border-radius:4px;height:18px;overflow:hidden}
  .barrow .fill{height:100%;background:var(--primary);border-radius:4px;transition:.4s}
  .barrow .val{width:34px;color:var(--text)}

  .set-sec{margin-bottom:22px}
  .mod-chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-bg);color:#0958d9;
    border:1px solid var(--blue-bd);border-radius:16px;padding:5px 12px;margin:0 8px 8px 0;font-size:13px}
  .mod-chip .x{cursor:pointer;color:#0958d9;font-weight:700;padding:0 2px}
  .mod-chip .x:hover{color:var(--red)}
  .danger-zone{border:1px solid var(--red-bd);border-radius:var(--radius);padding:16px;background:var(--red-bg)}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:10px;width:620px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
  .modal-body{padding:20px 22px;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafafa;border-radius:0 0 10px 10px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .form-grid .full{grid-column:1/3}
  .role3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .role3 .box{border:1px solid var(--line);border-radius:6px;padding:10px}
  .role3 .box .rh{font-weight:600;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .empty{text-align:center;color:var(--text3);padding:40px 0;font-size:13px}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:6px;z-index:200;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="mark">配</span> 配置协作平台</div>
    <nav class="nav" id="nav">
      <div class="nav-group">协作管理</div>
      <div class="nav-item active" data-view="dashboard">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        工作台
      </div>
      <div class="nav-item" data-view="kanban">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="6" y="1" width="4" height="10" rx="1"/><rect x="11" y="1" width="4" height="12" rx="1"/></svg>
        配置任务看板
      </div>
      <div class="nav-item" data-view="list">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="7" width="14" height="2" rx="1"/><rect x="1" y="12" width="14" height="2" rx="1"/></svg>
        任务列表
      </div>
      <div class="nav-item" data-view="matrix">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        角色分工矩阵
      </div>
      <div class="nav-item" data-view="stats">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="6.5" y="5" width="3" height="10" rx="1"/><rect x="12" y="1" width="3" height="14" rx="1"/></svg>
        统计报表
      </div>
      <div class="nav-group">系统</div>
      <div class="nav-item" data-view="settings">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="2.2"/><path d="M8 1l1.2 2 2.2-.5.6 2.1 2 1-1.2 1.9 1.2 1.9-2 1-.6 2.1-2.2-.5L8 15l-1.2-2-2.2.5-.6-2.1-2-1 1.2-1.9L1 6.6l2-1 .6-2.1 2.2.5z" opacity=".55"/></svg>
        系统设置
      </div>
    </nav>
    <div class="side-foot">中国电子 · 招聘系统改造<br>配置协作模块 v1.0</div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="crumb"><span id="crumbMain">工作台</span> <span class="sub" id="crumbSub">协作总览与我的待办</span></div>
      <div class="user">
        <span>李鑫 · 配置顾问</span>
        <span class="avatar">李</span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </section>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head" id="modalTitle">新建任务</div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="full">
          <label class="fld">任务名称<span class="req">*</span></label>
          <input id="f_name" placeholder="如：编码表标准梳理（院校/专业/学科/层次）">
        </div>
        <div>
          <label class="fld">所属模块<span class="req">*</span></label>
          <select id="f_module"></select>
        </div>
        <div>
          <label class="fld">优先级</label>
          <select id="f_priority">
            <option value="高">高</option><option value="中" selected>中</option><option value="低">低</option>
          </select>
        </div>
        <div class="full">
          <label class="fld">三方角色分工</label>
          <div class="role3">
            <div class="box">
              <div class="rh"><span class="dot" style="background:var(--blue-tag)"></span>配置顾问（我们）</div>
              <select id="f_rc"></select>
            </div>
            <div class="box">
              <div class="rh"><span class="dot" style="background:var(--green)"></span>业务顾问（客户）</div>
              <select id="f_rb"></select>
            </div>
            <div class="box">
              <div class="rh"><span class="dot" style="background:var(--gold)"></span>业务用户（客户）</div>
              <select id="f_ru"></select>
            </div>
          </div>
        </div>
        <div>
          <label class="fld">状态</label>
          <select id="f_status">
            <option value="待开始">待开始</option><option value="进行中">进行中</option>
            <option value="已完成">已完成</option><option value="阻塞">阻塞</option>
          </select>
        </div>
        <div>
          <label class="fld">负责人</label>
          <input id="f_owner" placeholder="如：李鑫 / 王顾问">
        </div>
        <div>
          <label class="fld">创建日期</label>
          <input id="f_start" type="date">
        </div>
        <div>
          <label class="fld">截止日期</label>
          <input id="f_due" type="date">
        </div>
        <div class="full">
          <label class="fld">备注</label>
          <textarea id="f_remark" placeholder="补充背景、依赖、风险提示等"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 数据层 ===================== */
const LS_KEY = 'cfgCollab_v1';
const ROLES = [
  {key:'rc', name:'配置顾问（我们）', short:'配置顾问', color:'var(--blue-tag)', cls:'r'},
  {key:'rb', name:'业务顾问（客户）', short:'业务顾问', color:'var(--green)',  cls:'p'},
  {key:'ru', name:'业务用户（客户）', short:'业务用户', color:'var(--gold)',   cls:'k'},
];
const STATUS = ['待开始','进行中','已完成','阻塞'];
const STATUS_COLOR = {'待开始':'var(--gray)','进行中':'var(--primary)','已完成':'var(--green)','阻塞':'var(--red)'};
const STATUS_BG = {'待开始':'var(--gray-bg)','进行中':'var(--blue-bg)','已完成':'var(--green-bg)','阻塞':'var(--red-bg)'};
const STATUS_BD = {'待开始':'var(--gray-bd)','进行中':'var(--blue-bd)','已完成':'var(--green-bd)','阻塞':'var(--red-bd)'};
const PRI_COLOR = {'高':'var(--red)','中':'var(--gold)','低':'var(--gray)'};
const PRI_BG = {'高':'var(--red-bg)','中':'var(--gold-bg)','低':'var(--gray-bg)'};
const PRI_BD = {'高':'var(--red-bd)','中':'var(--gold-bd)','低':'var(--gray-bd)'};
const ROLE_OPTS = ['负责','配合','知会','—'];

function todayStr(){const d=new Date();return d.toISOString().slice(0,10);}

function seedData(){
  const m = ['需求确认','编码表配置','流程配置','权限配置','数据清洗','UAT测试','培训上线','系统设置'];
  const T=[
    ['需求调研与确认','需求确认','负责','负责','配合','高','已完成','李鑫','2026-08-01','2026-08-10','客户业务现状与系统目标已对齐'],
    ['编码表标准梳理（院校/专业/学科/层次）','编码表配置','负责','配合','知会','高','进行中','李鑫','2026-08-05','2026-08-25','统一标准名称，避免清华/清华大学被判不同'],
    ['业务流程配置（职位发布内置内控）','流程配置','负责','配合','知会','高','进行中','张工','2026-08-08','2026-08-28','集团岗位标准内控点需业务顾问确认'],
    ['角色权限映射配置','权限配置','负责','负责','知会','中','待开始','李鑫','2026-08-10','2026-09-05','三方人员账号与数据权限划分'],
    ['历史数据清洗与导入','数据清洗','配合','负责','负责','中','待开始','王顾问','2026-08-12','2026-09-10','客户侧提供源数据，顾问配合校验'],
    ['简历解析规则校验','数据清洗','负责','知会','配合','高','阻塞','李鑫','2026-08-09','2026-08-20','解析引擎版本待定，阻塞中'],
    ['UAT测试用例编写','UAT测试','配合','负责','负责','中','待开始','赵测试','2026-08-15','2026-09-12',''],
    ['UAT执行与缺陷跟踪','UAT测试','配合','负责','负责','高','待开始','赵测试','2026-08-20','2026-09-20',''],
    ['关键用户培训','培训上线','配合','配合','负责','中','待开始','钱培训','2026-09-01','2026-09-15',''],
    ['上线切换与回滚预案','培训上线','负责','配合','知会','高','待开始','李鑫','2026-09-10','2026-09-22',''],
    ['运维交接文档','系统设置','负责','知会','知会','低','待开始','李鑫','2026-09-15','2026-09-24',''],
  ];
  let id=1;
  const tasks=T.map(r=>({id:'T'+(id++),name:r[0],module:r[1],rc:r[2],rb:r[3],ru:r[4],
    priority:r[5],status:r[6],owner:r[7],start:r[8],due:r[9],remark:r[10]}));
  return {modules:m, tasks};
}

let state = null;
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.tasks)return s;}catch(e){}
  return seedData();
}
state = load();

/* ===================== 工具 ===================== */
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function isOver(task){if(task.status==='已完成'||!task.due)return false;return task.due<todayStr();}
function roleTag(key,val){
  if(val==='—'||!val)return '<span class="rtag k">—</span>';
  const r=ROLES.find(x=>x.key===key);
  return `<span class="rtag ${r.cls}">${r.short.replace('（我们）','')}·${val}</span>`;
}
function statTag(s){return `<span class="tag" style="background:${STATUS_BG[s]};color:${STATUS_COLOR[s]};border-color:${STATUS_BD[s]}">${s}</span>`;}
function priTag(p){return `<span class="tag" style="background:${PRI_BG[p]};color:${PRI_COLOR[p]};border-color:${PRI_BD[p]}">${p}</span>`;}

/* ===================== 导航 ===================== */
const VIEWS={
  dashboard:{t:'工作台',s:'协作总览与我的待办'},
  kanban:{t:'配置任务看板',s:'按状态流转 · 拖拽卡片变更状态'},
  list:{t:'任务列表',s:'全量任务 · 筛选与导出'},
  matrix:{t:'角色分工矩阵',s:'三方谁负责 / 配合 / 知会'},
  stats:{t:'统计报表',s:'状态 / 模块 / 角色工作量分析'},

};
let curView='dashboard';
$('nav').addEventListener('click',e=>{
  const it=e.target.closest('.nav-item');if(!it)return;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));

});

/* ===================== 渲染分发 ===================== */
function render(){
  const c=$('content');
  if(curView==='dashboard')c.innerHTML=viewDashboard();
  else if(curView==='kanban')c.innerHTML=viewKanban();
  else if(curView==='list')c.innerHTML=viewList();

  else if(curView==='stats')c.innerHTML=viewStats();
  else if(curView==='settings')c.innerHTML=viewSettings();

}

/* ---------- 工作台 ---------- */
function viewDashboard(){
  const t=state.tasks;
  const cnt=s=>t.filter(x=>x.status===s).length;
  const total=t.length, done=cnt('已完成');
  const pct=total?Math.round(done/total*100):0;
  const myTodo=t.filter(x=>x.rc==='负责'&&x.status!=='已完成');
  const recent=[...t].sort((a,b)=>(b.due||'').localeCompare(a.start||'')).slice(0,6);
  const ring=ringSVG(pct);
  return `
  <div class="stat-row">
    ${statCard('总任务',total,'var(--primary)','var(--primary)')}
    ${statCard('待开始',cnt('待开始'),'var(--gray)','var(--gray)')}
    ${statCard('进行中',cnt('进行中'),'var(--primary)','var(--blue-tag)')}
    ${statCard('已完成',cnt('已完成'),'var(--green)','var(--green)')}
    ${statCard('阻塞',cnt('阻塞'),'var(--red)','var(--red)')}
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-title">完成进度 <span class="r">整体交付健康度</span></div>
      <div class="prog-wrap">
        ${ring}
        <div class="prog-meta">
          整体完成率 <b>${pct}%</b><br>
          已完成 ${done} / 共 ${total} 项<br>
          进行中 ${cnt('进行中')} 项 · 阻塞 ${cnt('阻塞')} 项需关注
        </div>
      </div>
      <div style="margin-top:16px">
        <div class="card-title" style="margin-bottom:8px">我的待办（配置顾问负责）</div>
        ${myTodo.length?`<table><tbody>${myTodo.map(x=>`
          <tr><td style="width:8px"><span class="dot" style="background:${STATUS_COLOR[x.status]}"></span></td>
          <td>${esc(x.name)}</td>
          <td>${priTag(x.priority)}</td>
          <td><span style="color:var(--text3);font-size:12px">${x.due||'—'}</span></td>
          <td style="text-align:right"><button class="btn sm ghost" data-act="openTask" data-id="${x.id}">处理</button></td></tr>`).join('')}</tbody></table>`
          :'<div class="empty">暂无待办，棒！</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-title">近期任务 <span class="r">按截止日期</span></div>
      ${recent.map(x=>`<div class="mini-row" style="padding:8px 0;border-bottom:1px solid var(--line2)">
        <span class="dot" style="background:${STATUS_COLOR[x.status]}"></span>
        <span style="flex:1">${esc(x.name)}</span>
        ${statTag(x.status)}</div>`).join('')}
      <div style="margin-top:14px;text-align:center"><button class="btn primary" data-act="goKanban">进入看板 →</button></div>
    </div>
  </div>`;
}
function statCard(lab,num,color,barcolor){
  return `<div class="stat"><div class="lab">${lab}</div><div class="num" style="color:${color}">${num}</div><div class="bar" style="background:${barcolor}"></div></div>`;
}
function ringSVG(pct){
  const r=34,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg class="prog-ring" width="92" height="92" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="#f0f2f5" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--primary)" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 46 46)"/>
    <text x="46" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="var(--primary)">${pct}%</text>
  </svg>`;
}

/* ---------- 看板 ---------- */
function viewKanban(){

function cardHTML(x){
  const over=isOver(x);

    <div class="roles">${roleTag('rc',x.rc)}${roleTag('rb',x.rb)}${roleTag('ru',x.ru)}</div>

/* ---------- 列表 ---------- */
function viewList(){

function listFilter(){

  </tr></thead><tbody>${rows.map(x=>`<tr>
    <td>${esc(x.name)}</td><td><span class="tag gray">${esc(x.module)}</span></td>
    <td>${priTag(x.priority)}</td><td>${statTag(x.status)}</td>
    <td>${roleCell(x.rc)}</td><td>${roleCell(x.rb)}</td><td>${roleCell(x.ru)}</td>
    <td>${esc(x.owner||'—')}</td><td>${x.due||'—'}</td>
    <td><button class="btn sm ghost" data-act="openTask" data-id="${x.id}">编辑</button>
        <button class="btn sm danger" data-act="delTask" data-id="${x.id}">删除</button></td>
  </tr>`).join('')}</tbody></table>`;

function roleCell(v){if(v==='—'||!v)return '<span style="color:var(--text3)">—</span>';
  const c=v==='负责'?'var(--green)':v==='配合'?'var(--gold)':'var(--gray)';
  return `<span style="color:${c};font-weight:600">${v}</span>`;}

/* ---------- 角色矩阵 ---------- */
function viewMatrix(){
  const t=state.tasks;
  const sum=k=>{const o={};ROLE_OPTS.forEach(r=>o[r]=t.filter(x=>x[k]===r).length);return o;};
  const sums=ROLES.map(r=>({...r,o:sum(r.key)}));
  const cards=sums.map(r=>`<div class="role-card">
    <h4><span class="dot" style="background:${r.color}"></span>${r.name}</h4>
    <div class="lg">负责 <b style="color:var(--green)">${r.o['负责']}</b> · 配合 <b style="color:var(--gold)">${r.o['配合']}</b> · 知会 <b style="color:var(--gray)">${r.o['知会']}</b> · 未参与 <b>${r.o['—']}</b></div>
  </div>`).join('');
  const head=`<tr><th>任务名称</th><th>模块</th>${ROLES.map(r=>`<th>${r.short}</th>`).join('')}<th>状态</th></tr>`;
  const rows=t.map(x=>`<tr><td>${esc(x.name)}</td><td><span class="tag gray">${esc(x.module)}</span></td>
    ${ROLES.map(r=>`<td class="mb">${roleBadge(x[r.key])}</td>`).join('')}
    <td>${statTag(x.status)}</td></tr>`).join('');
  return `<div class="role-sum">${cards}</div>
    <div class="card"><div class="card-title">分工明细矩阵 <span class="r">绿=负责 · 金=配合 · 灰=知会/未参与</span></div>
    <table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
function roleBadge(v){if(v==='—'||!v)return '<span class="tag gray">—</span>';
  const c=v==='负责'?'var(--green)':v==='配合'?'var(--gold)':'var(--gray)';
  const bg=v==='负责'?'var(--green-bg)':v==='配合'?'var(--gold-bg)':'var(--gray-bg)';
  const bd=v==='负责'?'var(--green-bd)':v==='配合'?'var(--gold-bd)':'var(--gray-bd)';
  return `<span class="tag" style="background:${bg};color:${c};border-color:${bd}">${v}</span>`;}

/* ---------- 统计 ---------- */
function viewStats(){
  const t=state.tasks;
  const total=t.length;
  const sc={};STATUS.forEach(s=>sc[s]=t.filter(x=>x.status===s).length);
  const mc={};state.modules.forEach(m=>mc[m]=t.filter(x=>x.module===m).length);
  const rc={};ROLES.forEach(r=>{rc[r.short]={};['负责','配合','知会'].forEach(v=>rc[r.short][v]=t.filter(x=>x[r.key]===v).length);});
  const donut=donutSVG(STATUS.map(s=>({label:s,val:sc[s],color:STATUS_COLOR[s]})));
  const maxMod=Math.max(1,...Object.values(mc));
  const modBars=Object.entries(mc).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>barRow(k,v,maxMod)).join('');
  const roleBars=ROLES.map(r=>{
    const o=rc[r.short];const mx=Math.max(o['负责'],o['配合'],o['知会']);
    return `<div style="margin-bottom:14px"><div style="font-weight:600;font-size:12px;margin-bottom:6px"><span class="dot" style="background:${r.color}"></span>${r.name}</div>
      ${['负责','配合','知会'].map(vv=>barRow(vv+' '+o[vv],o[vv],mx)).join('')}</div>`;
  }).join('');
  return `<div class="chart-grid">
    <div class="card"><div class="card-title">任务状态分布</div>
      <div style="display:flex;gap:20px;align-items:center">
        ${donut}
        <div class="legend">${STATUS.map(s=>`<div class="li"><span class="dot" style="background:${STATUS_COLOR[s]};margin:0"></span>${s} <b style="margin-left:auto;color:var(--text)">${sc[s]}</b></div>`).join('')}</div>
      </div></div>
    <div class="card"><div class="card-title">模块任务量</div>${modBars||'<div class="empty">暂无数据</div>'}</div>
    <div class="card" style="grid-column:1/3"><div class="card-title">角色工作量（负责/配合/知会）</div>${roleBars}</div>
  </div>`;
}
function barRow(name,val,max){
  const w=max?Math.round(val/max*100):0;
  return `<div class="barrow"><span class="name">${esc(name)}</span>
    <span class="track"><span class="fill" style="width:${w}%"></span></span>
    <span class="val">${val}</span></div>`;
}
function donutSVG(data){
  const total=data.reduce((s,d)=>s+d.val,0)||1;const r=52,c=2*Math.PI*r;let off=0;
  const segs=data.map(d=>{const len=c*d.val/total;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${d.color}" stroke-width="16" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">${segs}
    <text x="70" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">${total}</text>
    <text x="70" y="86" text-anchor="middle" font-size="11" fill="var(--text3)">总任务</text></svg>`;
}

/* ---------- 设置 ---------- */
function viewSettings(){
  const chips=state.modules.map(m=>`<span class="mod-chip">${esc(m)}<span class="x" data-act="delMod" data-mod="${esc(m)}">×</span></span>`).join('');

    <div class="card-title">模块管理 <span class="r">用于任务分类，新建任务时可选</span></div>

  </div>

function addMod(){const v=$('newMod').value.trim();if(!v){toast('请输入模块名');return;}
  if(state.modules.includes(v)){toast('模块已存在');return;}
  state.modules.push(v);save();render();toast('已添加：'+v);}
function delMod(m){state.modules=state.modules.filter(x=>x!==m);
  state.tasks.forEach(t=>{if(t.module===m)t.module='';});save();render();toast('已删除模块');}
function resetSeed(){if(!confirm('将用示例数据覆盖当前数据，确定？'))return;state=seedData();save();render();toast('已恢复示例数据');}
function clearAll(){if(!confirm('确定清空全部任务与模块？此操作不可恢复！'))return;
  state={modules:[],tasks:[]};save();render();toast('已清空');}

/* ===================== 任务弹窗 ===================== */
let editId=null, curMod='';
function fillModuleSelect(){const sel=$('f_module');if(!sel)return;
  sel.innerHTML='<option value="">请选择</option>'+state.modules.map(m=>`<option ${m===curMod?'selected':''}>${esc(m)}</option>`).join('');}
function fillRoleSelect(id,val){const sel=$(id);sel.innerHTML=ROLE_OPTS.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('');}
function openTask(id){
  editId=id||null;
  if(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;
    $('modalTitle').textContent='编辑任务';
    $('f_name').value=t.name;curMod=t.module;$('f_module').value=t.module;
    $('f_priority').value=t.priority;
    fillRoleSelect('f_rc',t.rc);fillRoleSelect('f_rb',t.rb);fillRoleSelect('f_ru',t.ru);
    $('f_status').value=t.status;$('f_owner').value=t.owner||'';
    $('f_start').value=t.start||'';$('f_due').value=t.due||'';$('f_remark').value=t.remark||'';
  }else{
    $('modalTitle').textContent='新建任务';
    $('f_name').value='';$('f_priority').value='中';curMod='';
    fillModuleSelect();$('f_module').value='';
    fillRoleSelect('f_rc','负责');fillRoleSelect('f_rb','配合');fillRoleSelect('f_ru','知会');
    $('f_status').value='待开始';$('f_owner').value='';$('f_start').value=todayStr();$('f_due').value='';$('f_remark').value='';
  }
  $('mask').classList.add('show');
}
function closeModal(){$('mask').classList.remove('show');}
function saveTask(){
  const name=$('f_name').value.trim();if(!name){toast('请填写任务名称');return;}
  const mod=$('f_module').value;if(!mod){toast('请选择所属模块');return;}
  const data={name,module:mod,priority:$('f_priority').value,
    rc:$('f_rc').value,rb:$('f_rb').value,ru:$('f_ru').value,
    status:$('f_status').value,owner:$('f_owner').value.trim(),
    start:$('f_start').value,due:$('f_due').value,remark:$('f_remark').value.trim()};
  if(editId){const t=state.tasks.find(x=>x.id===editId);Object.assign(t,data);toast('已保存修改');}
  else{data.id='T'+Date.now();state.tasks.push(data);toast('已新建任务');}
  save();closeModal();render();
}
function delTask(id){if(!confirm('确定删除该任务？'))return;
  state.tasks=state.tasks.filter(x=>x.id!==id);save();render();toast('已删除');}
$('btnCancel').onclick=closeModal;
$('btnSave').onclick=saveTask;
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function goKanban(){curView='kanban';document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view==='kanban'));
  $('crumbMain').textContent=VIEWS.kanban.t;$('crumbSub').textContent=VIEWS.kanban.s;render();}

/* ===================== 拖拽（看板） ===================== */
let dragId=null;
function bindKanban(){
  document.querySelectorAll('.kcard').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.card;e.dataTransfer.setData('text',dragId);});
  });
  document.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('hl');});
    col.addEventListener('dragleave',e=>col.classList.remove('hl'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('hl');
      const s=col.dataset.status;const t=state.tasks.find(x=>x.id===dragId);
      if(t&&t.status!==s){t.status=s;if(s==='已完成'&&!t.due)t.due=todayStr();save();render();toast('状态已更新为：'+s);}});
  });
}

/* ===================== 事件委托（替代内联 onclick / onchange） ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, id=el.dataset.id, mod=el.dataset.mod;
  if(a==='openTask')openTask(id||null);
  else if(a==='goKanban')goKanban();
  else if(a==='delTask')delTask(id);
  else if(a==='delMod')delMod(mod);
  else if(a==='addMod')addMod();
  else if(a==='exportJSON')exportJSON();
  else if(a==='importClick')$('imp').click();
  else if(a==='resetSeed')resetSeed();
  else if(a==='clearAll')clearAll();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='lf_s'||id==='lf_p'||id==='lf_m')listFilter();
  else if(id==='imp')importJSON(e);
});
document.addEventListener('input',e=>{ if(e.target.id==='lf_q')listFilter(); });

/* ===================== 导入导出 ===================== */
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='配置协作数据_'+todayStr()+'.json';a.click();toast('已导出');}
function importJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.tasks)throw 0;
    if(!confirm('导入将覆盖当前数据，确定？'))return;state=d;if(!state.modules)state.modules=[...new Set(d.tasks.map(x=>x.module).filter(Boolean))];save();render();toast('导入成功');}
    catch(err){toast('文件格式错误');}};rd.readAsText(f);e.target.value='';}

/* ===================== 绑定 & 启动 ===================== */
function bindView(){
  if(curView==='list')renderListBody();
  if(curView==='kanban')bindKanban();
}
render();
</script>
</body>
</html>
