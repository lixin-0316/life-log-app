<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8402f">
<title>今天吃什么 · 厨房菜谱点菜</title>
<style>
:root{
  --bg:#f8f4ec;
  --surface:#ffffff; --surface2:#fcf9f4; --line:#ece4d8;
  --text:#241f1a; --text2:#6e655a; --muted:#a0958a;
  --brand:#cf4a2e; --brand2:#e8794b; --green:#2f7d63; --gold:#c99a3f; --danger:#c0392b;
  --sh1:0 1px 2px rgba(50,35,20,.06); --sh2:0 10px 28px rgba(70,45,20,.10); --sh3:0 22px 52px rgba(70,45,20,.18);
  --r:18px; --r-sm:12px; --r-lg:24px;
}
body.dark{
  --bg:#141110; --surface:#211c18; --surface2:#2a241f; --line:#3a332b;
  --text:#f0e9df; --text2:#bcb1a3; --muted:#8d8375;
  --brand:#e2674a; --brand2:#ef8b62; --green:#4f9d82; --gold:#c99a3f;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 28px rgba(0,0,0,.5); --sh3:0 22px 52px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 620px at 100% -12%, rgba(232,121,75,.10) 0%, transparent 60%),
    radial-gradient(900px 520px at -12% 112%, rgba(47,125,99,.09) 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--green);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;transition:border-color .15s, box-shadow .15s}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--brand);vertical-align:-2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(207,74,46,.12)}
textarea{resize:vertical;min-height:54px}
::placeholder{color:var(--muted)}

#app{max-width:1180px;margin:0 auto;display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
#sidebar{width:236px;flex:0 0 236px;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
.brand-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(150deg,var(--brand),var(--brand2));box-shadow:0 8px 18px rgba(207,74,46,.32)}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.3px}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--text2);transition:all .18s;text-align:left;width:100%}
.nav-ico{font-size:19px;width:24px;text-align:center}
.nav-item:hover{background:var(--surface);color:var(--text);box-shadow:var(--sh1)}
.nav-item.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 22px rgba(207,74,46,.30)}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:11.5px;color:var(--muted);line-height:1.7}
#main{flex:1;min-width:0;padding:26px 28px 100px}
#tabbar{display:none}

/* ---------- generic ---------- */
.page-head{margin:2px 0 18px}
.page-title{font-size:26px;font-weight:800;letter-spacing:.3px;line-height:1.2}
.page-sub{color:var(--text2);font-size:13.5px;margin-top:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.pad{padding:18px}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.sub{color:var(--text2);font-size:12.5px}
.sec-title{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;margin:0 0 12px}
.sec-title .dot{width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--brand),var(--brand2))}
.grid{display:grid;gap:15px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:10px 17px;font-size:14px;font-weight:600;
  background:var(--surface);color:var(--text);border:1px solid var(--line);transition:all .16s;white-space:nowrap}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;box-shadow:0 8px 20px rgba(207,74,46,.30)}
.btn-primary:hover{box-shadow:0 12px 26px rgba(207,74,46,.40);filter:brightness(1.03)}
.btn-green{background:linear-gradient(135deg,var(--green),#3f9b7c);color:#fff;border:none;box-shadow:0 8px 20px rgba(47,125,99,.28)}
.btn-ghost{background:none;border-color:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{color:var(--danger);border-color:rgba(192,57,43,.35)}
.btn-danger:hover{background:rgba(192,57,43,.08)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn-ico{width:32px;height:32px;padding:0;flex:0 0 32px;font-size:14px;border-radius:9px;line-height:1}
.btn-lg{padding:14px 26px;font-size:16px;border-radius:15px}
.btn-block{width:100%}
.btn-row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}

/* ---------- chips / segmented ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 8px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--text2);white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}

/* ---------- hero ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{font-size:30px;font-weight:800;margin:0;letter-spacing:.3px}
.hero p{margin:6px 0 0;color:var(--text2);font-size:14px}

/* ---------- dish grid ---------- */
.dish-grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.dish-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden;cursor:pointer;transition:transform .16s, box-shadow .16s;display:flex;flex-direction:column}
.dish-card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.dish-card:active{transform:translateY(-1px) scale(.995)}
.dish-hero{height:112px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dish-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.5),transparent 55%)}
.dish-emoji{font-size:52px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));transform:translateY(1px)}
.dish-qty{position:absolute;top:9px;left:9px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(207,74,46,.45);z-index:2}
.dish-info{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;z-index:2;transition:all .15s}
.dish-info:hover{background:#fff;color:var(--text);transform:scale(1.08)}
.dish-body{padding:12px 14px 14px;flex:1}
.dish-name{font-weight:800;font-size:15.5px;line-height:1.3;letter-spacing:.2px}
.dish-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--text2)}
.tag{padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--text2);white-space:nowrap}
.spicy{color:var(--brand);font-size:12px;letter-spacing:-1px}

/* ---------- fab ---------- */
.fab{position:fixed;right:26px;bottom:26px;z-index:40;display:flex;align-items:center;gap:12px;padding:13px 20px;border-radius:999px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;font-size:15px;box-shadow:0 14px 32px rgba(207,74,46,.45);transition:transform .16s}
.fab:hover{transform:translateY(-2px) scale(1.02)}
.fab .cnt{background:rgba(255,255,255,.24);border-radius:999px;padding:1px 9px;font-size:13px}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .rname{font-weight:700;font-size:15px}
.row .rsub{font-size:12.5px;color:var(--text2);margin-top:2px}
.strike{text-decoration:line-through;color:var(--muted)}

/* ---------- shopping ---------- */
.sec-head{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;padding:13px 16px;background:var(--surface2);border-bottom:1px solid var(--line);color:var(--brand)}
.sec-head .n{margin-left:auto;background:var(--brand);color:#fff;font-size:11.5px;border-radius:999px;padding:0 9px;font-weight:700}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:var(--surface);transition:all .15s}
.check:hover{border-color:var(--muted)}
.check.on{background:var(--green);border-color:var(--green)}
.src{color:var(--green);cursor:pointer}
.src:hover{text-decoration:underline}

/* ---------- stepper ---------- */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:34px;height:34px;font-size:18px;color:var(--text);transition:background .15s}
.stepper button:hover{background:var(--surface2)}
.stepper .v{min-width:34px;text-align:center;font-weight:800;font-size:15px}

/* ---------- cook ---------- */
.cook-step{display:flex;gap:15px;padding:20px 18px;border-bottom:1px solid var(--line);align-items:flex-start;transition:background .15s}
.cook-step:last-child{border-bottom:none}
.cook-no{flex:0 0 38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 6px 14px rgba(207,74,46,.3);cursor:pointer}
.cook-step.done{opacity:.55}
.cook-step.done .cook-no{background:var(--green);box-shadow:none}
.cook-step .ctext{font-size:19px;line-height:1.5;font-weight:600}
.cook-tag{font-size:12px;color:var(--green);font-weight:800;margin-bottom:3px;letter-spacing:.3px}
.hint{font-size:13px;color:var(--gold);margin-top:6px;font-weight:600}
.timer-box{margin-top:11px}
.timer-display{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand);letter-spacing:1px}
.timer-bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:7px}
.timer-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width 1s linear}
.big-timer{position:sticky;top:10px;z-index:20}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text);margin:0;font-weight:500;
  padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);cursor:pointer;transition:all .15s}
.chks label:hover{border-color:var(--muted);background:var(--surface)}
.chks label:has(input:checked){border-color:var(--brand);background:rgba(207,74,46,.08);color:var(--brand);font-weight:700}
.chks input{width:15px;height:15px;margin:0;accent-color:var(--brand);flex:0 0 15px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.w-full{width:100%}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit-row{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}

/* ---------- misc ---------- */
.empty{text-align:center;padding:54px 20px;color:var(--text2)}
.empty .big{font-size:52px;margin-bottom:10px;filter:grayscale(.1)}
.warn{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.35);color:var(--danger);border-radius:12px;padding:11px 14px;font-size:13px;margin:12px 0;font-weight:600}
.info{background:rgba(47,125,99,.09);border:1px solid rgba(47,125,99,.3);color:var(--green);border-radius:12px;padding:11px 14px;font-size:13px;margin:12px 0}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(207,74,46,.12);color:var(--brand)}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.kv:last-child{border:none}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none}
#modal.show{display:block}
.modal-mask{position:absolute;inset:0;background:rgba(20,15,10,.5);backdrop-filter:blur(2px);animation:fade .2s}
.modal-box{position:relative;max-width:440px;margin:12vh auto 0;background:var(--surface);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh3);animation:pop .22s}
.modal-box h3{margin:0 0 10px;font-size:18px;font-weight:800}
.modal-box .alert{color:var(--danger);font-weight:700;margin:8px 0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--surface);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:86%;text-align:center;box-shadow:var(--sh2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger);color:#fff}

/* ---------- responsive ---------- */
@media (max-width:900px){
  #sidebar{display:none}
  #main{padding:18px 15px 108px}
  .page-title{font-size:22px}
  .hero h1{font-size:24px}
  .dish-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .dish-hero{height:92px}.dish-emoji{font-size:42px}
  .fr{grid-template-columns:1fr}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(60,40,20,.06)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--text2);transition:color .15s}
  .tab-ico{font-size:21px;line-height:1}
  .tab.on{color:var(--brand)}
  .fab{right:14px;bottom:74px;padding:11px 17px;font-size:14px}
  .cook-step .ctext{font-size:17px}
}
@media (max-width:420px){
  .dish-grid{grid-template-columns:repeat(2,1fr)}
  .fr3{grid-template-columns:1fr 1fr}
}
@media print{
  body{background:#fff}
  #sidebar,#tabbar,#modal,#toast,.no-print,.fab{display:none !important}
  #app{max-width:100%}#main{padding:0}
  .card{box-shadow:none;border:none}
  .print-only{display:block !important}
  a{color:#000}
}
.print-only{display:none}
</style>


</head>

    return Number(v);
  }

  /* 7.1 食材合并 */
  function mergeIngredients(data, order){
    const byId = {};
    (data.dishes||[]).forEach(d => byId[d.id] = d);
    const aliasMap = buildAliasMap(data);
    const settings = data.settings || {};
    const pantry = data.pantry || [];
    const servings = (order && order.servings) || 2;
    const acc = new Map();
    const fuzzy = new Map();

    (order.items||[]).forEach(function(it){
      const dish = byId[it.dishId];
      if(!dish) return;
      const factor = effServings(it, order) / (dish.baseServings||2) * (it.qty||1);
      const srcLabel = dish.name + ((it.qty||1) > 1 ? ' ×'+it.qty : '');
      (dish.ingredients||[]).forEach(function(ing){
        const name = normalizeName(ing.name, aliasMap);
        if(isFuzzy(ing.unit)){
          const k = name + '@' + ing.unit;
          let e = fuzzy.get(k);
          if(!e){ e = { key:'fz_'+name, name:name, amount:0, unit:ing.unit, section:'fuzzy', sources:[], optional:!!ing.optional, fuzzy:true }; fuzzy.set(k,e); }
          if(e.sources.indexOf(srcLabel) < 0) e.sources.push(srcLabel);
          if(ing.optional) e.optional = true;
          return;
        }
        const base = toBase(ing.amount, ing.unit);
        const scaled = shouldScale(ing, settings) ? base[0] * factor : base[0];
        const key = name + '@' + base[1];
        let item = acc.get(key);
        if(!item){
          item = { key:key, name:name, amount:0, unit:base[1], section:ing.section||'veg', sources:[], optional:!!ing.optional, fuzzy:false };
          acc.set(key, item);
        }
        item.amount += scaled;
        if(item.sources.indexOf(srcLabel) < 0) item.sources.push(srcLabel);
        if(ing.optional) item.optional = true;
      });
    });

    const out = [];
    acc.forEach(function(it){
      const b = beautify(it.amount, it.unit);
      it.amount = b[0]; it.unit = b[1];
      it.hasAtHome = pantry.some(p => p.name === it.name);
      out.push(it);
    });
    fuzzy.forEach(function(it){ it.hasAtHome = pantry.some(p => p.name === it.name); out.push(it); });

    out.sort(function(a,b){
      const sa = SECTION_ORDER[a.section]!=null ? SECTION_ORDER[a.section] : 9;
      const sb = SECTION_ORDER[b.section]!=null ? SECTION_ORDER[b.section] : 9;
      if(sa !== sb) return sa - sb;
      return a.name.localeCompare(b.name, 'zh');
    });
    return out;
  }

  /* 7.3 并行备菜建议（贪心） */
  function planSteps(data, order){
    const byId = {};
    (data.dishes||[]).forEach(d => byId[d.id] = d);
    const lead = [], rest = [];
    (order.items||[]).forEach(function(it){
      const dish = byId[it.dishId];
      if(!dish) return;
      const steps = dish.steps||[];
      let i = 0;
      while(i < steps.length && steps[i].parallel) i++;
      for(let k=0;k<i;k++) lead.push({dishName:dish.name, dishId:dish.id, step:steps[k], qty:it.qty||1});
      for(let k=i;k<steps.length;k++) rest.push({dishName:dish.name, dishId:dish.id, step:steps[k], qty:it.qty||1});
    });
    const merged = lead.concat(rest);
    const seenTool = {};
    const steps = merged.map(function(f){
      let hint = '';
      if(f.step.parallel) hint = '⏳ 等待中，可同时做别的';
      if(f.step.tool){
        if(seenTool[f.step.tool]) hint = (hint ? hint+' · ' : '') + '⚠ 同用「'+f.step.tool+'」，建议错开';
        seenTool[f.step.tool] = true;
      }
      return { dishName:f.dishName, dishId:f.dishId, step:f.step, qty:f.qty, hint:hint };
    });
    let serial = 0, saving = 0;
    merged.forEach(function(f){ const m = f.step.min||0; serial += m; if(f.step.parallel) saving += m; });
    const total = Math.max(0, serial - saving);
    return { steps:steps, serial:serial, saving:saving, total:total };
  }

  function normalizeData(d){
    d = d || {};
    d.schemaVersion = d.schemaVersion || 1;
    d.settings = Object.assign({defaultServings:2, allergens:[], scaleSeasoning:false, theme:'light', lastOrderId:''}, d.settings||{});
    d.cuisines = d.cuisines||[];
    d.categories = d.categories||[];
    d.dishes = d.dishes||[];
    d.orders = d.orders||[];
    d.pantry = d.pantry||[];
    d.history = d.history||[];
    d.aliasMap = d.aliasMap||[];
    if(!d._meta) d._meta = { updatedAt: 0 };
    d._meta.updatedAt = Number(d._meta.updatedAt) || 0;
    return d;
  }

  function _get(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function _set(key, val){ try { localStorage.setItem(key, val); return true; } catch(e){ return false; } }

  function storeLoad(){
    const raw = _get(STORE_KEY) || _get(STORE_KEY+'__bak') || _get(STORE_KEY+'__bak2');
    if(raw){
      try { return normalizeData(JSON.parse(raw)); }
      catch(e){ /* 损坏则回退 seed */ }
    }
    const seed = normalizeData(JSON.parse(JSON.stringify(SEED)));
    storeSave(seed); // 首次安装 seed
    return seed;
  }

  function storeSave(data){
    const json = JSON.stringify(data);
    try {
      const prev = localStorage.getItem(STORE_KEY);
      if(prev){
        const b1 = localStorage.getItem(STORE_KEY+'__bak');
        localStorage.setItem(STORE_KEY+'__bak2', b1 || prev);
        localStorage.setItem(STORE_KEY+'__bak', prev);
      }
      localStorage.setItem(STORE_KEY, json);
      return {ok:true};
    }catch(e){
      const quota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
      return {ok:false, quota:quota, err:e};
    }
  }

  function exportJSON(data){
    const out = JSON.parse(JSON.stringify(data));
    out.schemaVersion = 1;
    out.exportedAt = new Date().toISOString();
    return JSON.stringify(out, null, 2);
  }

  function importJSON(text){
    let d;
    try { d = JSON.parse(text); } catch(e){ throw new Error('JSON 解析失败：不是有效的备份文件'); }
    if(!d || typeof d !== 'object' || (!d.dishes && !d.cuisines)){
      throw new Error('文件内容不像是菜谱备份（缺少 dishes / cuisines）');
    }
    if(d.schemaVersion && d.schemaVersion !== 1){
      throw new Error('schemaVersion 不受支持：' + d.schemaVersion);
    }
    return normalizeData(d);
  }

  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  return {
    STORE_KEY:STORE_KEY, UNITS:UNITS, FUZZY_UNITS:FUZZY_UNITS, SECTIONS:SECTIONS,
    SECTION_LABEL:SECTION_LABEL, SECTION_ORDER:SECTION_ORDER, ALLERGENS:ALLERGENS,
    ORDER_STATUS:ORDER_STATUS, STATUS_LABEL:STATUS_LABEL,
    isFuzzy:isFuzzy, toBase:toBase, beautify:beautify, fmtNum:fmtNum,
    normalizeName:normalizeName, buildAliasMap:buildAliasMap, shouldScale:shouldScale,
    effServings:effServings, mergeIngredients:mergeIngredients, planSteps:planSteps,
    normalizeData:normalizeData, storeLoad:storeLoad, storeSave:storeSave,
    exportJSON:exportJSON, importJSON:importJSON, uid:uid
  };
})();

/* ============================================================
 * KM.cloud —— 云端共享存储（多端同步）
 * 服务器提供 /api/kitchen；离线 / file:// / 无此接口时自动降级为纯本地。
 * ============================================================ */
KM.cloud = (function(){
  const API = '/api/kitchen';
  const PENDING_KEY = 'kitchen_menu_v1__pending';
  const canFetch = (typeof fetch === 'function');
  const enabled = canFetch && (location.protocol === 'http:' || location.protocol === 'https:');
  let timer = null;

  function setPending(v){ try { localStorage.setItem(PENDING_KEY, v ? '1' : '0'); } catch(e){} }
  function isPending(){ try { return localStorage.getItem(PENDING_KEY) === '1'; } catch(e){ return false; } }

  function push(data){
    if(!enabled) return;
    try {
      fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ data: data }) })
        .then(function(r){ return r.json(); })
        .then(function(j){ setPending(!(j && j.ok)); })
        .catch(function(){ setPending(true); });
    } catch(e){ setPending(true); }
  }
  function schedulePush(data){
    if(!enabled) return;
    if(timer) clearTimeout(timer);
    timer = setTimeout(function(){ push(data); }, 800);
  }
  function pull(){
    if(!enabled) return Promise.resolve(null);
    return fetch(API, { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .catch(function(){ return null; });
  }
  // 启动同步：云端空 → 播种；本地更新/pending → 上推；云端更新 → 采纳
  function sync(localData, onAdopt){
    if(!enabled) return;
    pull().then(function(res){
      if(!res || !res.ok){
        if(isPending()) push(localData);
        return;
      }
      const serverData = res.data;
      if(!serverData){ push(localData); return; }
      const sT = Number(serverData._meta && serverData._meta.updatedAt) || 0;
      const lT = Number(localData._meta && localData._meta.updatedAt) || 0;
      if(isPending() || lT > sT){ push(localData); }
      else if(sT > lT){ onAdopt(serverData); }
    });
  }
  return { enabled: enabled, sync: sync, schedulePush: schedulePush, pull: pull, isPending: isPending };
})();

  function startTimer(min,label){
    clearInterval(timer.id); timer.remain=Math.round(Number(min)*60); timer.total=timer.remain; timer.label=label||'';
    if(navigator.wakeLock){ try{ navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){} }
    const box=$('#bigTimer'); if(box) box.style.display='block';
    timer.id=setInterval(()=>{ timer.remain--; if(timer.remain<=0){ clearInterval(timer.id); timer.id=null; beep(); flash(); toast('⏰ 计时结束：'+timer.label,'err'); } renderTimer(); },1000);
    renderTimer();
  }
  function stopTimer(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } }
  function renderTimer(){ const box=$('#bigTimer'); if(!box) return; if(timer.id===null && timer.remain<=0 && !timer.total){ box.style.display='none'; return; } const mm=Math.floor(timer.remain/60),ss=timer.remain%60; const el=$('#timerDisplay'),bar=$('#timerBar'),lab=$('#timerLabel'); if(el) el.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss; if(bar) bar.style.width=(timer.total?Math.max(0,timer.remain/timer.total*100):0)+'%'; if(lab) lab.textContent=timer.label||''; }
  function beep(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); [0,0.2,0.4].forEach(t=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; o.type='sine'; g.gain.setValueAtTime(0.0001,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.18); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.2); }); }catch(e){} }

  function saveDish(){
    const d=state.editDraft; if(!d) return;
    if(!d.name || !d.name.trim()){ toast('请填菜名','err'); return; }
    if(!(d.ingredients||[]).length){ toast('至少要有 1 个食材','err'); return; }
    if(!(d.steps||[]).length){ toast('至少要有 1 个步骤','err'); return; }
    const dup=data.dishes.some(x=>x.id!==d.id && x.name===d.name && !x.archived);
    if(dup){ toast('已有同名菜「'+d.name+'」','err'); return; }
    d.steps.forEach((s,i)=>{ s.no=i+1; });
    if(d.id==='__new__'){ d.id=C.uid('dish'); d.createdAt=new Date().toISOString(); d.updatedAt=d.createdAt; data.dishes.unshift(d); }
    else { d.updatedAt=new Date().toISOString(); const idx=data.dishes.findIndex(x=>x.id===d.id); if(idx>=0) data.dishes[idx]=d; }
    save(); state.editDraft=null; toast('已保存'); nav('#/dishes');
  }

  function deleteDish(id){
    const d=byId(id); if(!d) return;
    const used=data.orders.some(o=>(o.items||[]).some(i=>i.dishId===id)) || (data.history||[]).some(h=>(h.dishIds||[]).indexOf(id)>=0);

  }

  /* ---------- 云端自动同步 ---------- */
  let _lastAuto=0;
  function maybeAutoSync(){
    if(!KM.cloud||!KM.cloud.enabled) return; const now=Date.now(); if(now-_lastAuto<12000) return; _lastAuto=now;
    KM.cloud.pull().then(res=>{ if(!res||!res.ok||!res.data) return; const z=zoneOf(parseHash().name); if(z!=='order') return;
      const sT=Number(res.data._meta&&res.data._meta.updatedAt)||0, lT=Number(data._meta&&data._meta.updatedAt)||0;
      if(sT>lT){ data=C.normalizeData(res.data); C.storeSave(data); applyTheme(); route(); toast('已同步云端最新数据'); } });
  }

  /* ---------- 初始化 ---------- */
  function init(){
    data=C.storeLoad(); applyTheme();
    window.addEventListener('hashchange',()=>route());
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') maybeAutoSync(); });
    renderSidebar(); renderTabbar(); route(); _lastAuto=Date.now();
    if(KM.cloud){ KM.cloud.sync(data, serverData=>{ data=C.normalizeData(serverData); C.storeSave(data); applyTheme(); renderSidebar(); route(); toast('已同步云端最新数据'); }); }
  }

  return {
    init:init, nav:nav, route:route, modalClose:modalClose,
    setFilter:setFilter, randomPick:randomPick, openDish:openDish, addDishToOrder:addDishToOrder, addFromDetail:addFromDetail,
    dishServings:dishServings,
    listQty:listQty, orderServings:orderServings, clearOrder:clearOrder,
    toggleChecked:toggleChecked, toggleAtHome:toggleAtHome, copyList:copyList,
    cookToggle:cookToggle, finishCook:finishCook, startTimer:startTimer,
    newDish:newDish, editDish:editDish, deleteDish:deleteDish, duplicateDish:duplicateDish,
    editField:editField, editTags:editTags, editCat:editCat, editAllergen:editAllergen,
    addIng:addIng, editIng:editIng, delIng:delIng, moveIng:moveIng,
    addStep:addStep, editStep:editStep, delStep:delStep, moveStep:moveStep, saveDish:saveDish,
    addCuisine:addCuisine, addCategory:addCategory, deleteCuisine:deleteCuisine, deleteCategory:deleteCategory,
    moveCuisine:moveCuisine, moveCategory:moveCategory,
    setSetting:setSetting, setAllergen:setAllergen, toggleTheme:toggleTheme, cloudRefresh:cloudRefresh,
    doExport:doExport, doImport:doImport, doReset:doReset, addPantry:addPantry, delPantry:delPantry, redoOrder:redoOrder
  };
})();

document.addEventListener('DOMContentLoaded', function(){ KM.ui.init(); });
if(document.readyState !== 'loading') KM.ui.init();
</script>
